# Values for prometheus-community/kube-prometheus-stack.
# Sized for the solo-talos cluster (1 control plane and 2 workers).

defaultRules:
  create: true
  rules:
    # kube-proxy is replaced by Cilium.
    kubeProxy: false

    # Talos control-plane metrics require dedicated endpoints/TLS configuration.
    # Keep these rules disabled until those targets are configured.
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: Europe/Paris

  # Grafana 13 can unload bundled datasource plugins while attempting to
  # auto-update them on its read-only root filesystem. Keep the versions
  # shipped in the image so Prometheus remains available after startup.
  grafana.ini:
    plugins:
      preinstall_auto_update: false

  # Keep Grafana private initially. Use kubectl port-forward to access it.
  ingress:
    enabled: false

  persistence:
    enabled: true
    type: sts
    storageClassName: longhorn
    accessModes:
      - ReadWriteOnce
    size: 2Gi
    finalizers:
      - kubernetes.io/pvc-protection

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    shards: 1
    scrapeInterval: 30s
    evaluationInterval: 30s
    retention: 7d
    retentionSize: 16GiB
    walCompression: true
    enableAdminAPI: false

    externalLabels:
      cluster: solo-talos

    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi

    # Discover monitoring resources created later by Cilium, Longhorn, etc.,
    # including resources located outside the monitoring namespace.
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}

    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}

    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}

    probeSelectorNilUsesHelmValues: false
    probeSelector: {}
    probeNamespaceSelector: {}

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi

# kube-proxy is intentionally absent when using Cilium replacement mode.
kubeProxy:
  enabled: false

# These Talos control-plane targets will be configured separately once the
# base monitoring stack has been validated.
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false
